name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # orchestra/testbench N targets Laravel N+2.
          - { php: '8.2', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          # Laravel 13 requires PHP 8.3+.
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '13', testbench: '11' }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Pin the Laravel version under test
        run: composer require --dev --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Report resolved versions
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E '^(name|versions)' || true

      - name: Run tests
        run: vendor/bin/phpunit

  mysql:
    name: MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: psgc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # SQLite ignores VARCHAR lengths and stores booleans as integers, so the
      # index-width and boolean-filter behaviour can only be proven here.
      - name: Run tests against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: psgc_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit
