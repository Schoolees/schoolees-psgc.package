name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # orchestra/testbench N targets Laravel N+2.
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '11', testbench: '9' }
          - { php: '8.3', laravel: '11', testbench: '9' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          # Laravel 13 requires PHP 8.3+.
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '13', testbench: '11' }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Pin the Laravel version under test
        run: composer require --dev --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Report resolved versions
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E '^(name|versions)' || true

      - name: Run tests
        run: vendor/bin/phpunit
